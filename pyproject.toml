[project]
name = "hiring-bias"
version = "0.1.0"
description = "Reproducibility pipeline and artifacts for studying monocultural hiring biases in language models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dill>=0.4.1",
    "numpy>=2.2.6",
    "openai>=2.1.0",
    "pandas>=2.3.1",
    "plotly>=6.6.0",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
    "sentence-transformers>=5.3.0",
    "statsmodels>=0.14.6",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "transformers>=4.56.0",
    "snowflake-snowpark-python[modin]>=1.48.0",
    "polars>=1.39.3",
    "kaleido>=1.2.0",
    "retry>=0.9.2",
]

[project.optional-dependencies]
full = [
    "decord>=0.6.0",
    "google-api-core>=2.30.0",
    "google-genai>=1.68.0",
    "llm-utils",
    "vllm==0.18.0",
    "moviepy>=2.2.1"
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.uv.sources]
llm-utils = { git = "https://github.com/matthewbbone/llm-utils.git" }
